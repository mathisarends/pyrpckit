[project]
name = "pyrpckit"
version = "0.2.0"
description = "Decorator-driven, transport-agnostic JSON-RPC 2.0 protocols for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mathis Arends", email = "mathisarends27@gmail.com" }]
dependencies = ["pydantic>=2.11"]

[project.scripts]
pyrpckit = "pyrpckit.codegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyrpckit"]

[dependency-groups]
dev = [
    { include-group = "showcase" },
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
showcase = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pyrpckit"]

[tool.coverage.report]
show_missing = true
